<!DOCTYPE html>
<html>
<head>
    <title>Test POST Request</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"] { padding: 8px; width: 200px; }
        button { padding: 10px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Send a POST Request over RUDP</h1>
    
    <form action="/submit" method="POST">
        <div class="form-group">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="user" required>
        </div>

        <div class="form-group">
            <label for="action_val">Action:</label>
            <input type="text" id="action_val" name="action" value="browser_test" required>
        </div>

        <button type="submit">Submit via POST</button>
    </form>
</body>
</html>
